# 採点ナビ — マークシート テンプレート
# ビルド不要の静的サイト。リポジトリ直下をそのまま公開する。

[build]
  publish = "."
  command = ""

# /Login（および小文字の /login）でログイン画面を返す
[[redirects]]
  from = "/Login"
  to = "/Login.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/Login.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
